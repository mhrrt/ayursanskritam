<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Contact Us</title>

  <!-- FAVICON -->

  <link
    rel="icon"
    type="image/png"
    href="./images/favicon.png"
  />

  <link
    rel="stylesheet"
    href="./css/styles.css"
  />

</head>

<body>

  <!-- PAGE CONTAINER -->

  <div class="page-container">

    <!-- HEADER -->

    <header class="topbar">

      <button id="menuBtn">
        ☰
      </button>

      <h1>Sanskrit Learning</h1>

    </header>

    <!-- DRAWER -->

    <nav id="drawer" class="drawer">

      <a href="index.html">Home</a>

      <a href="submit.html">
        Submit Details
      </a>

      <a href="youtube.html">
        YouTube Library
      </a>

      <a href="about.html">
        About Us
      </a>

      <a href="contact.html">
        Contact Us
      </a>

    </nav>

    <div id="overlay" class="overlay"></div>

    <!-- MAIN -->

    <main>

      <section class="form-container">

        <h2>Contact Us</h2>

        <form id="contactForm">

          <input
            type="text"
            id="name"
            placeholder="Your Name"
            required
          />

          <input
            type="email"
            id="email"
            placeholder="Your Email"
            required
          />

          <textarea
            id="query"
            rows="5"
            placeholder="Your Query"
            required
          ></textarea>

          <button type="submit">
            Submit
          </button>

        </form>

        <p id="message"></p>

      </section>

    </main>

    <!-- FOOTER -->

    <div id="footer"></div>

  </div>

  <script src="./js/config.js"></script>

  <script src="./js/contact.js"></script>

  <script src="./js/app.js"></script>

</body>

</html>
